# Pages CMS configuration: the editing forms the team uses at https://app.pagescms.org
# Each entry below is one form. "description" lines are the help text editors see.
# Field names must match the JSON keys the site reads (see README).

media:
  input: public/images/uploads
  output: /images/uploads

content:
  # ---------------------------------------------------------------- Site settings
  - name: site
    label: Site settings
    type: file
    path: src/content/settings/site.json
    format: json
    fields:
      - { name: company_name, label: Company name, type: string, required: true }
      - { name: product_name, label: Product name, type: string, required: true }
      - { name: tagline, label: Tagline, type: string, description: Shown in the footer. }
      - { name: description, label: One-sentence description, type: text, description: Used by search engines. Keep it factual. }
      - { name: contact_email, label: Contact email, type: string, required: true, description: Used by every Contact and Email button. }
      - { name: announcement, label: Announcement strip (top of every page), type: string, description: One short line. Leave empty to hide the strip. }
      - { name: announcement_link_text, label: Announcement link text, type: string }
      - { name: announcement_link, label: Announcement link, type: string, description: "Example: /how-it-works/ or a full web address" }
      - { name: disclaimer, label: Class project disclaimer (footer), type: text, required: true, description: Keep this. It tells visitors the company and data are fictional. }

  # ---------------------------------------------------------------- Home page
  - name: home
    label: Home page
    type: file
    path: src/content/pages/home.json
    format: json
    fields:
      - { name: seo_title, label: Browser tab and Google title, type: string, required: true }
      - { name: seo_description, label: Google description, type: text, required: true, description: About 150 characters. }
      - { name: hero_eyebrow, label: Small label above the headline, type: string }
      - { name: hero_title, label: Headline, type: string, required: true }
      - { name: hero_text, label: Intro paragraph, type: text, required: true }
      - { name: primary_cta_text, label: Main button text, type: string }
      - { name: primary_cta_link, label: Main button link, type: string }
      - { name: secondary_cta_text, label: Second button text, type: string }
      - { name: secondary_cta_link, label: Second button link, type: string }
      - name: facts
        label: Fact band (dark strip under the hero)
        description: Four is best. Big value plus a short label.
        type: object
        list: { min: 1, max: 6, collapsible: { collapsed: true, summary: "{fields.value} {fields.label}" } }
        fields:
          - { name: value, label: Big value, type: string, required: true, description: "Example: 25%" }
          - { name: label, label: Label, type: string, required: true }
      - { name: features_title, label: Features heading, type: string }
      - name: features
        label: Feature cards
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }
          - { name: link, label: Link (optional), type: string, description: "Leave empty for no link. Example: /claims/" }
          - { name: link_text, label: Link text (optional), type: string }
      - { name: map_eyebrow, label: Road map small label, type: string }
      - { name: map_title, label: Road map heading, type: string }
      - { name: map_text, label: Road map intro, type: text }
      - { name: snapshot_title, label: Data snapshot heading, type: string }
      - { name: snapshot_text, label: Data snapshot intro, type: text }

  # ---------------------------------------------------------------- How it works
  - name: how
    label: How it works page
    type: file
    path: src/content/pages/how.json
    format: json
    fields:
      - { name: seo_title, label: Browser tab and Google title, type: string, required: true }
      - { name: seo_description, label: Google description, type: text, required: true }
      - { name: title, label: Page headline, type: string, required: true }
      - { name: intro, label: Intro paragraph, type: text }
      - name: steps
        label: Steps
        description: Drag to reorder. Numbers are added automatically.
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: Step name, type: string, required: true }
          - { name: text, label: Explanation, type: text, required: true }
      - { name: vault_title, label: Claim Vault callout heading, type: string, description: Leave empty to hide the callout. }
      - { name: vault_text, label: Claim Vault callout text, type: text }
      - { name: vault_link_text, label: Claim Vault callout button text, type: string }
      - { name: vault_link, label: Claim Vault callout button link, type: string, description: "Usually /claims/" }
      - { name: levels_title, label: Data levels heading, type: string }
      - name: levels
        label: Data levels
        description: Keep these in step with the DATA_LEVEL table in the database.
        type: object
        list: { collapsible: { collapsed: true, summary: "Level {fields.level}: {fields.name}" } }
        fields:
          - { name: level, label: Level number, type: string, required: true }
          - { name: name, label: Name, type: string, required: true }
          - { name: receives, label: What a buyer receives, type: string, required: true }
          - { name: default, label: Default setting, type: select, options: { values: [Opt-in, "Off", Not offered] } }
      - { name: privacy_title, label: Privacy heading, type: string }
      - { name: privacy, label: Privacy commitments, type: string, list: true, description: One commitment per line. }
      - { name: events_title, label: Road events table heading, type: string }
      - { name: events_text, label: Road events table intro, type: text }

  # ---------------------------------------------------------------- For data buyers
  - name: buyers
    label: For data buyers page
    type: file
    path: src/content/pages/buyers.json
    format: json
    fields:
      - { name: seo_title, label: Browser tab and Google title, type: string, required: true }
      - { name: seo_description, label: Google description, type: text, required: true }
      - { name: title, label: Page headline, type: string, required: true }
      - { name: intro, label: Intro paragraph, type: text }
      - name: segments
        label: Buyer types
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.name}" } }
        fields:
          - { name: name, label: Buyer type, type: string, required: true }
          - { name: use, label: What they use it for, type: text, required: true }
          - { name: access, label: What they can access, type: string, required: true }
      - { name: view_title, label: Buyer feed heading, type: string }
      - { name: view_text, label: Buyer feed intro, type: text }
      - { name: partners_title, label: Insurer partner block heading, type: string, description: Leave empty to hide the block. }
      - { name: partners_text, label: Insurer partner block intro, type: text }
      - { name: partners_points, label: Insurer partner rules, type: string, list: true, description: One rule per line. Keep these in step with the CLAIM_ACCESS_GRANT rules in the database. }
      - { name: partners_cta, label: Insurer partner button text, type: string }
      - { name: launch_title, label: Launch plan heading, type: string }
      - name: launch
        label: Launch phases
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.phase}: {fields.market}" } }
        fields:
          - { name: phase, label: Phase, type: string, required: true }
          - { name: market, label: Market, type: string, required: true }
          - { name: focus, label: Focus, type: text, required: true }
      - { name: cta_title, label: Bottom call-to-action heading, type: string }
      - { name: cta_text, label: Bottom call-to-action text, type: text }

  # ---------------------------------------------------------------- Claim Vault
  - name: claims
    label: Claim Vault page
    type: file
    path: src/content/pages/claims.json
    format: json
    fields:
      - { name: seo_title, label: Browser tab and Google title, type: string, required: true }
      - { name: seo_description, label: Google description, type: text, required: true }
      - { name: eyebrow, label: Small label above the headline, type: string }
      - { name: title, label: Page headline, type: string, required: true }
      - { name: intro, label: Intro paragraph, type: text, required: true }
      - name: steps
        label: How the vault works (steps)
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: Step name, type: string, required: true }
          - { name: text, label: Explanation, type: text, required: true }
      - { name: access_title, label: Who can see it heading, type: string }
      - name: access
        label: Who can see your vault (table rows)
        description: Write "Never" exactly to get the dark badge.
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.who}: {fields.answer}" } }
        fields:
          - { name: who, label: Who, type: string, required: true }
          - { name: answer, label: Can they see it?, type: string, required: true }
          - { name: note, label: Details, type: string }
      - { name: insurer_title, label: Insurer claim access heading, type: string }
      - { name: insurer_text, label: Insurer claim access intro, type: text }
      - { name: insurer_points, label: Insurer claim access rules, type: string, list: true, description: One rule per line. Must match what the database enforces. }
      - { name: honest_title, label: Caution box heading, type: string }
      - { name: honest_text, label: Caution box text, type: text, required: true, description: Keep this. It tells drivers footage can also hurt their claim. }
      - { name: faq_title, label: FAQ heading, type: string }
      - name: faq
        label: FAQ
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.q}" } }
        fields:
          - { name: q, label: Question, type: string, required: true }
          - { name: a, label: Answer, type: text, required: true }
      - { name: cta_title, label: Bottom heading, type: string }
      - { name: cta_text, label: Bottom text, type: text }

  # ---------------------------------------------------------------- Demo data snapshot
  - name: road_events
    label: "Demo data: road events"
    type: file
    path: src/content/data/road_events.json
    format: json
    fields:
      - { name: as_of, label: Snapshot date, type: string, description: "Format YYYY-MM-DD" }
      - { name: note, label: Note under the table, type: text }
      - name: events
        label: Road events
        description: Copied from the detected_event table. Fictional demo data only.
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.event_id} {fields.event_type}" } }
        fields:
          - { name: event_id, label: Event ID, type: string, required: true }
          - { name: event_type, label: Event type, type: string, required: true }
          - { name: confidence, label: Confidence (0 to 1), type: number }
          - { name: latitude, label: Latitude, type: number }
          - { name: longitude, label: Longitude, type: number }
          - { name: detected_at, label: Detected at, type: string, description: "Format YYYY-MM-DD HH:MM" }

  - name: buyer_view
    label: "Demo data: buyer feed"
    type: file
    path: src/content/data/buyer_view.json
    format: json
    fields:
      - { name: as_of, label: Snapshot date, type: string }
      - { name: note, label: Note under the table, type: text }
      - name: rows
        label: Buyer feed rows
        description: Copied from the buyer_road_events view. Never add customer, device or clip IDs here.
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.event_date} {fields.buyer}" } }
        fields:
          - { name: license_id, label: License ID, type: string }
          - { name: buyer, label: Licensee, type: string }
          - { name: data_level, label: Data level, type: number }
          - { name: event_type, label: Event type, type: string }
          - { name: segment_lat, label: Segment latitude, type: number }
          - { name: segment_lon, label: Segment longitude, type: number }
          - { name: event_date, label: Date, type: string }
          - { name: confirming_devices, label: Cameras confirming, type: number }
          - { name: avg_confidence, label: Average confidence, type: number }

  - name: north_split
    label: "Demo data: North Split map"
    type: file
    path: src/content/data/north_split_demo.json
    format: json
    fields:
      - { name: as_of, label: Demo date, type: string, description: "Format YYYY-MM-DD. Shown to buyers as the event date." }
      - { name: start_time, label: Playback start time, type: string, description: "24-hour HH:MM, for example 06:30" }
      - { name: duration_min, label: Playback length (minutes of demo time), type: number }
      - { name: your_camera, label: Which camera is "your camera", type: string, description: Must match a camera value used in the detections below. }
      - { name: note, label: Note under the map, type: text, description: Keep the "fictional" and "not to scale" wording. }
      - name: events
        label: Events on the map
        description: "x and y place the marker on the 800 x 600 drawing and must sit on a drawn road. lat and lon decide the buyer road segment."
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.id} {fields.type}" } }
        fields:
          - { name: id, label: Event ID, type: string, required: true }
          - { name: type, label: Event type, type: select, options: { values: [lane_closure, work_zone, debris, pothole] } }
          - { name: road, label: Where (driver view), type: string }
          - { name: detail, label: What the camera sees (driver view), type: text }
          - { name: lat, label: Latitude, type: number }
          - { name: lon, label: Longitude, type: number }
          - { name: x, label: Map x (0 to 800), type: number }
          - { name: y, label: Map y (0 to 600), type: number }
      - name: detections
        label: Camera sightings
        description: An event confirms when 3 different cameras have seen it. Camera values are demo labels, never real device IDs.
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.event} {fields.camera} at minute {fields.minute}" } }
        fields:
          - { name: event, label: Event ID, type: string, required: true }
          - { name: camera, label: Camera label, type: string, required: true }
          - { name: minute, label: Minutes after start, type: number }
          - { name: confidence, label: Confidence (0 to 1), type: number }
